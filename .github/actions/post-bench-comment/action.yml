name: post-bench-comment
description: Render bench output as a markdown PR comment and upsert it via marocchino/sticky-pull-request-comment. The header `pm-benchmark-<platform>` keys per-platform stickiness so re-runs replace rather than stack.

inputs:
  platform:
    description: Platform name (linux / mac) — used in the comment header marker
    required: true
  os:
    description: Runner OS string (ubuntu-latest / macos-latest) — shown in the comment title
    required: true
  github-token:
    description: GitHub token for `gh` CLI lookups + sticky-comment posting
    required: true

runs:
  using: composite
  steps:
    - name: Build PR comment body
      shell: bash
      run: bash .github/scripts/render-bench-comment.sh ${{ inputs.platform }} ${{ inputs.os }}
    - name: Find Current PR
      id: findPr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
      run: |
        PR_NUMBER=""
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
        else
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' || true)
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state open --json number --jq '.[0].number' || true)
          fi
        fi
        if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
        fi
    - name: Post PR Comment
      if: steps.findPr.outputs.number
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: pm-benchmark-${{ inputs.platform }}
        path: /tmp/pm-bench-output/pr_comment.md
        number: ${{ steps.findPr.outputs.number }}
        recreate: true
        GITHUB_TOKEN: ${{ inputs.github-token }}
